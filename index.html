<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PostSignal – content dla marek</title>
<meta name="description" content="PostSignal: reelsy, reklamy i UGC dla marek. Portfolio.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<video id="bgv" src="assets/video/bg.mp4" autoplay muted loop playsinline preload="auto"></video>
<canvas id="gl"></canvas>
<div id="spacer"></div>

<header class="ui">
  <img src="assets/img/logo.png" alt="PostSignal">
  <nav id="tabs" aria-label="Filtr portfolio"></nav>
</header>

<div id="hero" class="ui">
  <h1>Reels.<br>Ads.<br><span>UGC.</span></h1>
  <p>Content dla marek, który zatrzymuje scroll i sprzedaje.</p>
</div>

<div id="cap" class="ui"><div class="tag" id="c-tag"></div><h2 id="c-title"></h2><p id="c-desc"></p><span class="res" id="c-res"></span></div>
<div id="cnt" class="ui"><div id="cnt-n"></div><a href="mailto:contact@postsignal.eu">contact@postsignal.eu →</a></div>

<section id="cta" aria-label="Kontakt"><div class="cta-in">
  <div class="cta-l">
    <p class="eyebrow">Współpraca</p>
    <h2>Zróbmy content,<br><span>który sprzedaje.</span></h2>
    <a class="mail" href="mailto:contact@postsignal.eu">contact@postsignal.eu</a>
  </div>
  <form id="form" novalidate>
    <div class="chips" role="group" aria-label="Czego potrzebujesz">
      <label><input type="checkbox" name="topic" value="Reels"><span>Reels</span></label>
      <label><input type="checkbox" name="topic" value="Reklamy"><span>Reklamy</span></label>
      <label><input type="checkbox" name="topic" value="UGC"><span>UGC</span></label>
      <label><input type="checkbox" name="topic" value="Horizontal"><span>Horizontal</span></label>
    </div>
    <div class="row"><input name="name" placeholder="Imię" aria-label="Imię" autocomplete="name" required><input name="email" type="email" placeholder="E-mail" aria-label="E-mail" autocomplete="email" required></div>
    <input name="brand" placeholder="Marka / firma" aria-label="Marka lub firma" autocomplete="organization">
    <textarea name="msg" rows="3" placeholder="Opowiedz krótko o projekcie" aria-label="Wiadomość"></textarea>
    <input class="hp" name="_hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit">Wyślij zapytanie →</button>
    <p id="fstatus" role="status"></p>
  </form>
</div></section>

<div id="cursor" aria-hidden="true"><span>Play</span></div>
<div id="modal" role="dialog" aria-modal="true"><div class="box" id="box"></div></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
